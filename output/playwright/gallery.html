<!doctype html>
<html lang="en">
<head>

  <title>TransTaste — MengTo final UI</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#171712;color:#f3efe7;font:14px/1.5 Arial,sans-serif;padding:40px}header{max-width:900px;margin:0 auto 32px}h1{font-size:clamp(36px,7vw,84px);line-height:.9;letter-spacing:-.06em;text-transform:uppercase;margin:0 0 18px}.accent{color:#ff6b2c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;align-items:start}figure{margin:0;border:1px solid #44423b;background:#22221d}img{display:block;width:100%;height:auto}figcaption{padding:14px 16px;border-top:1px solid #44423b;text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:#bbb6aa}@media(max-width:600px){body{padding:20px}}

</html>
